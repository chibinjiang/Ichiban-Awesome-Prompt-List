[project]
name = "ichiban-awesome-prompt-list"
version = "0.1.0"
description = "A curated and experimentally validated prompt engineering knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ichiban" }]
dependencies = [
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
ichiban-prompt = "src.ichiban_prompt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
